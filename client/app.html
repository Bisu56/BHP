<!DOCTYPE html>
<html>
<head>
    <title>Nepal Home Price Prediction | नेपाल घर मूल्य अनुमान</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="img"></div>
<div class="header">
    <h1>🏠 घर मूल्य अनुमानकर्ता | Home Price Predictor</h1>
    <p class="subtitle">नेपालको लागि | For Nepal</p>
</div>
<form class="form">
    <h2>क्षेत्रफल (वर्ग फिट) | Area (Square Feet)</h2>
    <input class="area" type="text" id="uiSqft" class="floatLabel" name="Squareft" value="1000">
    <h2>BHK (बेडरूम संख्या) | BHK (Bedrooms)</h2>
    <div class="switch-field">
        <input type="radio" id="radio-bhk-1" name="uiBHK" value="1"/>
        <label for="radio-bhk-1">१ | 1</label>
        <input type="radio" id="radio-bhk-2" name="uiBHK" value="2" checked/>
        <label for="radio-bhk-2">२ | 2</label>
        <input type="radio" id="radio-bhk-3" name="uiBHK" value="3"/>
        <label for="radio-bhk-3">३ | 3</label>
        <input type="radio" id="radio-bhk-4" name="uiBHK" value="4"/>
        <label for="radio-bhk-4">४ | 4</label>
        <input type="radio" id="radio-bhk-5" name="uiBHK" value="5"/>
        <label for="radio-bhk-5">५ | 5</label>
    </div>
</form>
<form class="form">
    <h2>बाथरूम संख्या | Bathrooms</h2>
    <div class="switch-field">
        <input type="radio" id="radio-bath-1" name="uiBathrooms" value="1"/>
        <label for="radio-bath-1">१ | 1</label>
        <input type="radio" id="radio-bath-2" name="uiBathrooms" value="2" checked/>
        <label for="radio-bath-2">२ | 2</label>
        <input type="radio" id="radio-bath-3" name="uiBathrooms" value="3"/>
        <label for="radio-bath-3">३ | 3</label>
        <input type="radio" id="radio-bath-4" name="uiBathrooms" value="4"/>
        <label for="radio-bath-4">४ | 4</label>
        <input type="radio" id="radio-bath-5" name="uiBathrooms" value="5"/>
        <label for="radio-bath-5">५ | 5</label>
    </div>
    <h2>स्थान छान्नुहोस् | Location</h2>
    <div>
        <select class="location" name="" id="uiLocations">
            <option value="" disabled="disabled" selected="selected">स्थान छान्नुहोस् | Choose a Location</option>
            <option>Kathmandu | काठमाडौं</option>
            <option>Patan | पाटन</option>
            <option>Bhaktapur | भक्तपुर</option>
            <option>Baneshwor | बानेश्वर</option>
            <option>Maharajgunj | महाराजगंज</option>
        </select>
    </div>
    <button class="submit" onclick="onClickedEstimatePrice()" type="button">मूल्य अनुमान गर्नुहोस् | Estimate Price</button>
    <div id="uiEstimatedPrice" class="result"><h2></h2></div>
</form>
</body>
</html>
